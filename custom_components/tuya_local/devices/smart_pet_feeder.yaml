name: Pet feeder
products:
  - id: xrmz72mcfa17gmn4
    model: Smart Pet Feeder
entities:
  - entity: text
    translation_key: meal_plan
    category: config
    hidden: true
    dps:
      - id: 1
        type: base64
        optional: true
        name: value
  - entity: number
    translation_key: manual_feed
    dps:
      - id: 3
        type: integer
        optional: true
        name: value
        unit: portions
        range:
          min: 1
          max: 12
  - entity: button
    name: Quick feed
    icon: "mdi:food-drumstick"
    dps:
      - id: 3
        type: integer
        optional: true
        name: button
        mapping:
          - dps_val: 1
            value: true
  - entity: sensor
    class: battery
    dps:
      - id: 10
        type: integer
        name: sensor
        unit: "%"
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 13
        type: bitfield
        optional: true
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 13
        type: bitfield
        optional: true
        name: fault_code
  - entity: event
    name: Feed report
    dps:
      - id: 14
        type: integer
        optional: true
        name: event
        mapping:
          - dps_val: null
            value: null
          - dps_val: 0
            value: null
          - value: Fed
      - id: 14
        type: integer
        optional: true
        name: portions
  - entity: number
    name: Voice repetitions
    icon: "mdi:account-voice"
    category: config
    dps:
      - id: 16
        type: integer
        optional: true
        name: value
        range:
          min: 0
          max: 10
  - entity: button
    translation_key: factory_reset
    category: config
    hidden: true
    dps:
      - id: 24
        type: boolean
        optional: true
        name: button
  - entity: switch
    name: Water fountain
    icon: "mdi:fountain"
    dps:
      - id: 25
        type: boolean
        name: switch
